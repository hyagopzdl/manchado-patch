    <style>
      
.transfer-history-toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px}
.transfer-history-filters{display:flex;gap:8px;flex-wrap:wrap}
.transfer-date-group{margin-bottom:22px}
.transfer-date-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 9px;color:var(--muted);font-size:12px;font-weight:800;text-transform:capitalize}
.transfer-date-header span{font-size:10.5px;font-weight:650}
.transfer-market-card{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr);align-items:center;gap:0;padding:14px 16px;margin-bottom:8px;border:1px solid var(--border);border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--surface-soft) 88%,transparent),var(--surface));box-shadow:0 8px 26px rgba(0,0,0,.08)}
.transfer-market-card.is-rolled-back{opacity:.55}
.transfer-card-side{min-width:0;display:grid;align-items:center;gap:14px}
.transfer-card-left{grid-template-columns:minmax(215px,1.6fr) minmax(120px,1fr);padding-right:14px}
.transfer-card-right{grid-template-columns:minmax(120px,1fr) minmax(100px,.7fr) auto;padding-left:14px}
.transfer-player-block{min-width:0;display:grid;grid-template-columns:70px minmax(145px,1fr);align-items:center;gap:14px}
.transfer-overall{width:58px;height:58px;display:grid;place-items:center;border:1.5px solid;border-radius:999px;font-size:24px;font-weight:900;background:var(--surface-soft);text-shadow:0 0 18px currentColor}
.transfer-player-info{min-width:0;display:grid;justify-items:start;gap:4px}
.transfer-player-main{display:flex;align-items:center;gap:7px;min-width:0;width:100%}
.transfer-player-main strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.transfer-position-tag{display:inline-flex;flex:0 0 auto;color:#fff;padding:3px 7px;border-radius:7px;font-size:10px;font-weight:850;line-height:1}
.transfer-player-info small,.transfer-party small,.transfer-price small{display:block;color:var(--muted);font-size:10.5px}
.transfer-party{min-width:0;display:flex;align-items:center;gap:9px}
.transfer-party>div{min-width:0}
.transfer-party strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.transfer-party-avatar{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;overflow:hidden;flex:0 0 auto;border:1px solid var(--border);font-size:12px;font-weight:850}
.transfer-arrow{width:52px;display:grid;place-items:center;font-size:30px;font-weight:400;color:var(--muted);text-align:center;justify-self:center}
.transfer-price{text-align:right;min-width:0}
.transfer-price strong{display:block;font-size:16px;font-weight:900;white-space:nowrap}
.transfer-admin-actions{display:flex;gap:6px;justify-content:flex-end}
.transfer-admin-actions button{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface-soft);color:var(--heading);cursor:pointer;font-size:16px;font-weight:900}
.transfer-admin-actions button:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:760px){
.transfer-history-toolbar{align-items:stretch;flex-direction:column}
.transfer-history-filters{display:grid;grid-template-columns:1fr 1fr}
.transfer-market-card{grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);padding:12px 9px 10px;border-radius:14px;row-gap:8px}
.transfer-card-side{gap:7px}
.transfer-card-left{grid-template-columns:minmax(96px,1.55fr) minmax(50px,.72fr);padding-right:3px}
.transfer-card-right{grid-template-columns:minmax(50px,.72fr) minmax(52px,.66fr);padding-left:3px}
.transfer-player-block{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:0;text-align:center}
.transfer-overall{width:36px;height:36px;border-radius:10px;font-size:16px}
.transfer-player-info{gap:3px;min-width:0;justify-items:center;width:100%}
.transfer-player-main{gap:5px;justify-content:center}
.transfer-player-main strong{font-size:12px;line-height:1.15}
.transfer-position-tag{padding:2px 5px;border-radius:5px;font-size:8px}
.transfer-player-info small{width:100%;font-size:9px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.transfer-party{flex-direction:column;justify-content:center;gap:4px;text-align:center;min-width:0}
.transfer-party>div{width:100%;min-width:0}
.transfer-party-avatar{width:36px;height:36px;font-size:10px;margin:0 auto}
.transfer-party strong{font-size:10.5px;line-height:1.15}
.transfer-party small{font-size:8.5px;line-height:1.15}
.transfer-origin,.transfer-destination{justify-content:center;text-align:center}
.transfer-arrow{width:22px;font-size:21px;line-height:1}
.transfer-price{text-align:right}
.transfer-price strong{font-size:12px;line-height:1.15}
.transfer-price small{display:block;font-size:7.8px;line-height:1.15;margin-top:3px;white-space:nowrap}
.transfer-admin-actions{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end;padding-top:8px;border-top:1px solid var(--border)}
.transfer-admin-actions button{width:30px;height:28px;border-radius:8px;font-size:13px}
}
@media(max-width:420px){
.transfer-market-card{grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr);padding:11px 7px 9px}
.transfer-card-side{gap:5px}
.transfer-card-left{grid-template-columns:minmax(88px,1.62fr) minmax(44px,.66fr);padding-right:2px}
.transfer-card-right{grid-template-columns:minmax(44px,.66fr) minmax(48px,.62fr);padding-left:2px}
.transfer-overall,.transfer-party-avatar{width:34px;height:34px}
.transfer-overall{border-radius:9px;font-size:15px}
.transfer-player-main strong{font-size:11.5px}
.transfer-position-tag{font-size:7.5px;padding:2px 4px}
.transfer-player-info small{font-size:8.5px}
.transfer-party strong{font-size:10px}
.transfer-party small{font-size:8px}
.transfer-arrow{width:18px;font-size:19px}
.transfer-price strong{font-size:11.5px}
.transfer-price small{font-size:7.2px}
}
</style>
